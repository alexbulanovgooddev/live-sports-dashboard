# Локальная база для разработки: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: live_sports_dashboard
    ports:
      - '5432:5432'
    volumes:
      # с Postgres 18 данные лежат в подкаталоге /var/lib/postgresql/<версия>
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d live_sports_dashboard']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
